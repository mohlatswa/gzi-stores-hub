async function decideLeave(req, staffById, typeById, status, note){
  if(!req) return;
  const employee = staffById[req.staff_id];
  const cover = req.cover_staff_id ? staffById[req.cover_staff_id] : null;
  const typeName = typeById[req.leave_type_id]?.name || "Leave";
  const span = `${otFmtDateShort(req.start_date)} – ${otFmtDateShort(req.end_date)}`;
  const workDays = lvWorkingDays(req.start_date, req.end_date);

  if(status==="approved" && !confirm(
    `Approve ${typeName} leave for ${employee?employee.name:"employee"} (${span})?` +
    (cover ? `\n\nThis creates ${workDays.length} pending overtime entr${workDays.length===1?"y":"ies"} for ${cover.name}.` : "\n\nNo cover person is set — no overtime will be created.")
  )) return;

  try{
    await LV.updateRequest(req.id, {
      status, decision_note: note||null,
      decided_by: null, decided_by_email: currentRole(), decided_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    });

    if(status==="approved"){
      if(cover && !req.overtime_generated){
        for(const d of workDays){
          const period = otPeriodForDate(d);
          await OT.createEntry({
            staff_id: cover.id, work_date: d, month: otMonth3(d),
            overtime_period: period || null, pay_month: otPayMonthForPeriod(period) || null,
            cover_for: employee?employee.name:null, cover_by: cover.name,
            shift: req.cover_shift || null, hours: 0, overtime_rate: null,
            remarks: req.cover_shift ? `Cover ${req.cover_shift}` : "Leave cover",
            reason: "Leave", status: "pending", source_leave_id: req.id,
            submitted_by_email: currentRole(),
            decided_by: null, decided_by_email: null, decided_at: null, decision_note: null,
            updated_at: new Date().toISOString()
          });
        }
        await LV.updateRequest(req.id, { overtime_generated:true, updated_at:new Date().toISOString() });
      }
      if(employee && employee.email){
        const lines = [
          `Hi ${esc(employee.name)},`,
          `Your <b>${esc(typeName)}</b> leave request for <b>${esc(span)}</b> (${workDays.length} working day${workDays.length===1?"":"s"}) has been <b>approved</b>.`,
          cover ? `Cover has been arranged with <b>${esc(cover.name)}</b>${req.cover_shift?` on ${esc(req.cover_shift)}`:""}.` : `No cover person was recorded for this leave.`,
          note ? `Note: ${esc(note)}` : ""
        ].filter(Boolean);
        try{
          await lvQueueEmail({
            to_email: employee.email, to_name: employee.name,
            subject: `Leave approved: ${typeName} ${req.start_date} to ${req.end_date}`,
            body_html: lvEmailShell("Leave approved", lines), body_text: lvTextFrom(lines),
            kind:"leave_decision", related_leave_id: req.id, send_after:new Date().toISOString()
          });
          await LV.updateRequest(req.id, { employee_notified_at:new Date().toISOString() });
        }catch(mailErr){ console.error("leave email failed", mailErr); }
      }
      toast(cover ? "Leave approved — cover overtime created (pending)." : "Leave approved.");
    } else {
      if(req.overtime_generated){
        try{ await sb("overtime_entries?source_leave_id=eq."+encodeURIComponent(req.id)+"&status=eq.pending", {method:"DELETE", headers:{Prefer:"return=minimal"}}); }
        catch(delErr){ console.error("could not remove generated cover overtime", delErr); }
        await LV.updateRequest(req.id, { overtime_generated:false, updated_at:new Date().toISOString() });
      }
      if(employee && employee.email){
        const lines = [
          `Hi ${esc(employee.name)},`,
          `Your <b>${esc(typeName)}</b> leave request for <b>${esc(span)}</b> has been <b>declined</b>.`,
          note ? `Reason: ${esc(note)}` : "",
          `Please speak to your manager if you have questions.`
        ].filter(Boolean);
        try{
          await lvQueueEmail({
            to_email: employee.email, to_name: employee.name,
            subject: `Leave declined: ${typeName} ${req.start_date} to ${req.end_date}`,
            body_html: lvEmailShell("Leave declined", lines), body_text: lvTextFrom(lines),
            kind:"leave_decision", related_leave_id: req.id, send_after:new Date().toISOString()
          });
          await LV.updateRequest(req.id, { employee_notified_at:new Date().toISOString() });
        }catch(mailErr){ console.error("leave email failed", mailErr); }
      }
      toast("Leave declined.");
    }
    renderRoute();
  }catch(err){
    console.error(err);
    toast(err.message || "Could not complete the decision.");
  }
}

/* ============================================================ *
 *  CSV  import / export
 * ============================================================ */
function toCSV(rows, cols){
  const head = cols.map(c=>c.key);
  const esc2 = s=>{ s=String(s==null?"":s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines = [head.join(",")];
  rows.forEach(r=>lines.push(cols.map(c=> esc2(c.type==="computed"?c.compute(r):r[c.key]) ).join(",")));
  return lines.join("\n");
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==='\r'){}
      else cur+=ch;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length && r.some(c=>c!==""));
}
function exportCSV(key){
  const sc=SCHEMAS[key];
  const blob=new Blob([toCSV(DB[key],sc.cols)],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="GZI_"+key+"_"+TODAY()+".csv"; a.click();
  URL.revokeObjectURL(a.href);
}
function importCSV(key, after){
  const sc=SCHEMAS[key];
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv";
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const rows=parseCSV(rd.result);
      if(rows.length<2){ alert("Nothing to import."); return; }
      const head=rows[0].map(h=>h.trim());
      const mode = confirm("OK = REPLACE all "+sc.label+" with the file.\nCancel = APPEND the file rows.");
      const recs = rows.slice(1).map(r=>{
        const o={id:uid()};
        sc.cols.forEach(c=>{
          const idx=head.indexOf(c.key);
          if(idx>-1){ let v=r[idx]; if(c.type==="number"||c.type==="money") v=v===""?"":num(v); o[c.key]=v; }
          else if(!(c.type==="computed")) o[c.key]=(c.type==="number"||c.type==="money")?0:"";
        });
        return o;
      });
      if(mode) DB[key]=recs; else DB[key]=DB[key].concat(recs);
      // renumber sn / lineNo
      if(sc.cols.some(c=>c.key==="sn")) DB[key].forEach((r,i)=>r.sn=i+1);
      if(sc.cols.some(c=>c.key==="lineNo")) DB[key].forEach((r,i)=>r.lineNo=i+1);
      save(); renderNav(); after&&after();
      alert(recs.length+" row(s) imported.");
    };
    rd.readAsText(file);
  };
  inp.click();
}

    <div class="ph"><div><h2>INVENTORY VERIFICATION FORM (IVF)</h2><div>GZI SA · Technical Stores</div></div><div>${esc(f.date)}</div></div>
    <table><tbody>
      <tr><td><b>Verified By</b></td><td>${esc(f.verifiedBy||"")}</td><td><b>Shift</b></td><td>${esc(f.shift||"")}</td><td><b>Signature</b></td><td>${esc(f.signature||"")}</td></tr>
      <tr><td><b>Total Items</b></td><td>${k.total}</td><td><b>Accurate</b></td><td>${k.acc}</td><td><b>In-accurate</b></td><td>${k.inacc}</td></tr>
      <tr><td><b>Compliance %</b></td><td>${k.pct}%</td><td><b>Empty Bins</b></td><td>${k.emptyBins}</td><td><b>PR / PO</b></td><td>${k.reorder}</td></tr>
    </tbody></table><br/>
    <table><thead><tr><th>#</th><th>Date</th><th>Material Code</th><th>Description</th><th>Min</th><th>Max</th><th>Movement Type</th><th>Location</th><th>Physical</th><th>SAP Qty</th><th>Variance</th><th>Re-order</th><th>Re-order Qty</th><th>Audit</th><th>Remarks</th></tr></thead>
    <tbody>${f.lines.map((l,i)=>{const v=(l.physical===""?"":num(l.physical)-num(l.sapQty));const ro=(num(l.physical)<=num(l.min)&&(num(l.min)>0||num(l.max)>0))?"Yes":"No";return `<tr><td>${i+1}</td><td>${esc(l.date||f.date)}</td><td>${esc(l.materialCode||"")}</td><td>${esc(l.description||"")}</td><td>${esc(l.min)}</td><td>${esc(l.max)}</td><td>${esc(l.movementType||"")}</td><td>${esc(l.location||"")}</td><td>${esc(l.physical)}</td><td>${esc(l.sapQty)}</td><td>${v}</td><td>${ro}</td><td>${esc(l.reorderQty||"")}</td><td>${esc(l.txnAudit||"")}</td><td>${esc(l.remarks||"")}</td></tr>`;}).join("")}</tbody></table>`);
}

/* ============================================================ *
 *  BACKUP / RESTORE / SEED
 * ============================================================ */
document.getElementById("btnBackup").onclick = ()=>{
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-back"><div class="modal">
    <h3>Backup / Restore</h3>
    <div class="body">
      <p class="hintline">Data lives in the shared GZI Stores Hub database. A JSON backup is still a good idea before big imports.</p>
      <div class="flex">
        <button class="btn" id="expJson">⬇ Export full backup (JSON)</button>
        <button class="btn sec" id="impJson">⬆ Restore from backup</button>
      </div>
      <div class="sechead">Per-tracker CSV</div>
      <div class="flex">${Object.keys(SCHEMAS).map(k=>`<button class="btn ghost sm" data-csv="${k}">${esc(SCHEMAS[k].label)}</button>`).join("")}</div>
      <div class="sechead" style="color:var(--danger)">Danger</div>
      <button class="btn danger sm" id="wipe">Erase ALL shared data</button>
    </div>
    <div class="foot"><button class="btn ghost" id="close">Close</button>
      <span class="right mini">Records: ${Object.keys(SCHEMAS).reduce((a,k)=>a+(DB[k]?.length||0),0)}</span></div>
  </div></div>`;
  root.querySelector("#close").onclick=closeModal;
  root.querySelector(".modal-back").onclick=e=>{ if(e.target.classList.contains("modal-back")) closeModal(); };
  root.querySelector("#expJson").onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="GZI_StoresHub_backup_"+TODAY()+".json"; a.click(); URL.revokeObjectURL(a.href);
  };
  root.querySelector("#impJson").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{ const fr=new FileReader(); fr.onload=()=>{
      try{ const d=JSON.parse(fr.result);
        if(!confirm("Replace ALL data in the SHARED database with this backup? Everyone will see this change."))return;
        DB=Object.assign(blank(),d); save(); closeModal(); renderNav(); renderRoute(); fillGlobalArea();
        alert("Backup restored to the shared database.");
      }catch(e){ alert("Invalid file: "+e.message); }
    }; fr.readAsText(inp.files[0]); };
    inp.click();
  };
  root.querySelectorAll("[data-csv]").forEach(b=>b.onclick=()=>exportCSV(b.dataset.csv));
  root.querySelector("#wipe").onclick=()=>{
    if(confirm("Erase ALL data in the SHARED database? Every user loses everything. This cannot be undone.") && confirm("Really erase every tracker for everyone?")){
      DB=blank(); save(); closeModal(); renderNav(); renderRoute(); fillGlobalArea();
    }
  };
};
document.getElementById("btnSeed").onclick = ()=>{
  const has = Object.keys(SCHEMAS).some(k=>DB[k]&&DB[k].length);
  if(has && !confirm("This REPLACES the shared data with the built-in sample set (based on the source trackers). Continue?")) return;
  DB = seedData(); save(); globalArea=""; renderNav(); fillGlobalArea(); renderRoute();
};

/* ============================================================ *
 *  AUTH GATE + BOOT
 * ============================================================ */
const AUTH_USER = "Admin", AUTH_PASS = "Admin";
const ROLES = ["Counter","Storeman","Store Controller","Supervisor","Manager"];
function currentRole(){ return sessionStorage.getItem("shb_role") || "Counter"; }
function canDeleteCounts(){ return /^(Supervisor|Manager)$/i.test(currentRole()); }
function canManageInventory(){ return /^(Supervisor|Manager)$/i.test(currentRole()); }

/* One-off: flatten any old parent+lines count sheets into flat count records. */
function migrateCounts(){
  if(!Array.isArray(DB.counts) || !DB.counts.some(r=>Array.isArray(r.lines))) return;
  const flat=[];
  DB.counts.forEach(r=>{
    if(!Array.isArray(r.lines)){ flat.push(r); return; }
    if(!r.lines.length){
      flat.push({id:r.id,countDate:r.countDate||"",week:r.weekNo||weekOf(r.countDate),month:r.month||monthOf(r.countDate),
        sapCode:"",description:"",partNo:"",uom:"",invType:"",counter:r.counter||"",machine:r.area||"",
        counted:"",sapQty:"",remarks:"Migrated from an empty count sheet"});
      return;
    }
    r.lines.forEach((l,i)=>{
      const it=findItem(l.sapCode)||{};
      flat.push({
        id:(i===0? r.id : uid()),
        countDate:r.countDate||"", week:r.weekNo||weekOf(r.countDate), month:r.month||monthOf(r.countDate),
        sapCode:l.sapCode||"", description:l.description||it.description||"", partNo:l.partNo||it.mpn||"",
        uom:l.uom||it.uom||"", invType:it.group||"", counter:r.counter||"", machine:it.machine||r.area||"",
        counted:(l.physical===""||l.physical==null)?"":num(l.physical),
        sapQty:(l.system===""||l.system==null)?"":num(l.system),
        remarks:l.comments||""
      });
    });
  });
  DB.counts=flat; save();
}

function startApp(){
  document.body.classList.add("authed");
  const rt=document.getElementById("roleTag"); if(rt) rt.textContent = "Role: "+currentRole();
  document.getElementById("globalArea").addEventListener("change",e=>{ globalArea=e.target.value; renderRoute(); });
  document.getElementById("btnRefresh").onclick = async ()=>{
    if(document.getElementById("modalRoot").innerHTML.trim()){ toast("Close the open dialog first."); return; }
    try{ await pullAll(); migrateCounts(); renderNav(); fillGlobalArea(); renderRoute(); }
    catch(e){ setSync("err"); toast("Refresh failed: "+e.message); }
  };
  document.getElementById("btnLogout").onclick = ()=>{
    sessionStorage.removeItem("shb_auth"); location.reload();
  };
  window.addEventListener("focus", ()=>{
    if(document.getElementById("modalRoot").innerHTML.trim()) return;
    pullAll().then(()=>{ migrateCounts(); renderNav(); fillGlobalArea(); renderRoute(); }).catch(()=>setSync("err"));
  });

  const app = document.getElementById("app");
  app.innerHTML = `<div class="empty">Loading the shared database…</div>`;
  pullAll().then(()=>{
    migrateCounts();
    renderNav(); fillGlobalArea(); renderRoute();
  }).catch(e=>{
    setSync("err");
    app.innerHTML = `<div class="empty">Could not reach the database.<br><br>${esc(e.message)}<br><br>
      <button class="btn" onclick="location.reload()">Retry</button></div>`;
  });
}
(function initAuth(){
  const form = document.getElementById("loginForm");
  const err = document.getElementById("lg_err");
  if(sessionStorage.getItem("shb_auth")==="1"){ startApp(); return; }
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const u = document.getElementById("lg_user").value.trim();
    const p = document.getElementById("lg_pass").value;
    const role = document.getElementById("lg_role").value || "Counter";
    if(u===AUTH_USER && p===AUTH_PASS){
      sessionStorage.setItem("shb_auth","1");
      sessionStorage.setItem("shb_role", role);
      startApp();
    }
    else { err.textContent = "Wrong username or password."; }
  });
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GZI SA — Technical Stores Hub</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1c2733; --muted:#63738a; --line:#e2e8f0;
    --brand:#0f4c81; --brand-ink:#ffffff; --accent:#12805c; --warn:#b7791f; --danger:#c0392b;
    --chip:#eef2f7; --hover:#f0f5fb; --shadow:0 1px 3px rgba(15,30,50,.08),0 6px 20px rgba(15,30,50,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f151c; --panel:#161e28; --ink:#e7edf4; --muted:#93a2b5; --line:#26313f;
      --brand:#2f7fbf; --brand-ink:#ffffff; --accent:#2fae83; --warn:#d9a441; --danger:#e05b4b;
      --chip:#1e2833; --hover:#1b2530; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--brand)}
  header.top{
    background:var(--brand);color:var(--brand-ink);padding:10px 16px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:40;flex-wrap:wrap
  }
  header.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  header.top .sub{font-size:11px;opacity:.8;margin-left:-8px}
  header.top .spacer{flex:1}
  header.top select,header.top button{font:inherit}
  .globalArea{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:4px 8px;border-radius:8px}
  .globalArea select{background:transparent;color:var(--brand-ink);border:0;outline:none}
  .globalArea select option{color:#000}
  .headbtn{background:rgba(255,255,255,.14);color:var(--brand-ink);border:1px solid rgba(255,255,255,.25);
    padding:6px 10px;border-radius:8px;cursor:pointer}
  .headbtn:hover{background:rgba(255,255,255,.24)}
  .layout{display:flex;min-height:calc(100vh - 52px)}
  nav.side{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
  nav.side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:12px 8px 4px}
  nav.side button{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
    padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit
  }
  nav.side button .ic{width:18px;text-align:center;opacity:.85}
  nav.side button:hover{background:var(--hover)}
  nav.side button.active{background:var(--brand);color:var(--brand-ink)}
  nav.side button .badge{margin-left:auto;background:var(--chip);color:var(--muted);border-radius:10px;padding:0 6px;font-size:11px}
  nav.side button.active .badge{background:rgba(255,255,255,.25);color:#fff}
  main{flex:1;padding:18px;min-width:0}
  .page-h{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
  .page-h h2{margin:0;font-size:20px}
  .page-h p{margin:0;color:var(--muted);font-size:12.5px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .toolbar input[type=search],.toolbar select{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit
  }
  .toolbar input[type=search]{min-width:220px}
  .btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600}
  .btn:hover{filter:brightness(1.07)}
  .btn.sec{background:var(--chip);color:var(--ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:5px 9px;font-size:12px;font-weight:600}
  .btn.danger{background:var(--danger)}
  .count{color:var(--muted);font-size:12px;margin-left:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .tablewrap{overflow:auto;max-width:100%}
  table.grid{border-collapse:collapse;width:100%;font-size:13px}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap;vertical-align:top}
  table.grid th{background:var(--panel);position:sticky;top:0;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  table.grid tbody tr:hover{background:var(--hover);cursor:pointer}
  table.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pill.ok{background:rgba(18,128,92,.14);color:var(--accent)}
  .pill.warn{background:rgba(183,121,31,.16);color:var(--warn)}
  .pill.bad{background:rgba(192,57,43,.14);color:var(--danger)}
  .pill.mut{background:var(--chip);color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:6px 0 18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .kpi .val{font-size:24px;font-weight:700;margin-top:4px}
  .kpi .hint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:var(--brand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .sechead{font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand)}
  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(10,18,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(880px,100%);}
  .modal h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .body{padding:16px 18px;max-height:64vh;overflow:auto}
  .modal .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  @media(max-width:700px){.formgrid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld.wide{grid-column:1/-1}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .fld input,.fld select,.fld textarea{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;width:100%
  }
  .fld textarea{min-height:60px;resize:vertical}
  .fld .ro{background:var(--chip);color:var(--muted)}
  .hintline{font-size:11px;color:var(--muted)}
  .subgrid{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .subgrid th,.subgrid td{border:1px solid var(--line);padding:4px 6px}
  .subgrid th{background:var(--chip);font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .subgrid input,.subgrid select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink);font:inherit}
  .subgrid input.num{text-align:right}
  .rowdel{color:var(--danger);cursor:pointer;font-weight:700;border:0;background:transparent}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .tag{background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 6px;font-size:11px}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .right{margin-left:auto}
  .mini{font-size:11.5px;color:var(--muted)}
  .syncdot{font-size:12px;line-height:1;color:#9aa7b6;transition:color .2s}
  .syncdot.ok{color:#31c48d}.syncdot.busy{color:#e0b341}.syncdot.err{color:#e05b4b}
  .login-back{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0f4c81,#0b2a47);display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(360px,100%);padding:26px 24px}
  .login-card h2{margin:0 0 2px;font-size:17px}
  .login-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:14px}
  .login-card input,.login-card select{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font:inherit}
  .login-card .btn{width:100%;margin-top:18px;padding:10px}
  .lg-err{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:8px}
  body.authed #loginGate{display:none}
  /* print */
  #printArea{display:none}
  @media print{
    header.top,nav.side,.toolbar,.no-print{display:none !important}
    body,main{background:#fff}
    .layout{display:block}
    main{padding:0}
    #app{display:none !important}
    #printArea{display:block !important}
    #printArea *{color:#000 !important}
    #printArea table{border-collapse:collapse;width:100%;font-size:11px}
    #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:left}
    #printArea h2{margin:0 0 2px}
    #printArea .ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  }
</style>
</head>
<body>
<header class="top">
  <h1>GZI SA · Technical Stores Hub</h1>
  <span class="sub">Wadeville · Plant 6000</span>
  <div class="globalArea" title="Filters the whole program by storage area">
    <span style="font-size:11px;opacity:.8">AREA</span>
    <select id="globalArea"><option value="">All areas</option></select>
  </div>
  <span class="spacer"></span>
  <span id="roleTag" class="sub" title="Your role this session"></span>
  <span id="syncDot" class="syncdot" title="Sync status">●</span>
  <button class="headbtn" id="btnRefresh" title="Reload latest data from the server">↻ Refresh</button>
  <button class="headbtn" id="btnBackup">Backup / Restore</button>
  <button class="headbtn" id="btnSeed">Load sample data</button>
  <button class="headbtn" id="btnLogout">Log out</button>
</header>

<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="app"></main>
</div>

<div id="printArea"></div>
<div id="modalRoot"></div>

<div id="loginGate" class="login-back">
  <form class="login-card" id="loginForm">
    <h2>GZI&nbsp;SA · Technical Stores Hub</h2>
    <p class="mini">Sign in to the shared stores database.</p>
    <label>Username<input id="lg_user" autocomplete="username" autofocus></label>
    <label>Password<input id="lg_pass" type="password" autocomplete="current-password"></label>
    <label>Your role<select id="lg_role">
      <option value="Counter">Counter</option>
      <option value="Storeman">Storeman</option>
      <option value="Store Controller">Store Controller</option>
      <option value="Supervisor">Supervisor</option>
      <option value="Manager">Manager</option>
    </select></label>
    <p class="mini" style="margin-top:6px">Only a Supervisor or Manager can delete count records.</p>
    <div id="lg_err" class="lg-err"></div>
    <button class="btn" type="submit">Sign in</button>
    <p class="mini" style="margin-top:10px">Online system — needs a connection. Data is shared by everyone who signs in.</p>
  </form>
</div>

<script>

/* ============================================================ *
 *  ONLINE PERSISTENCE — Supabase REST (PostgREST)
 *  Shared database. Each collection = table shb_<key> with shape
 *  { id text pk, data jsonb, updated_at }. Rows are flattened to
 *  plain objects in memory; writes are diffed against a shadow copy.
 * ============================================================ */
const SB = {
  url: "https://grszkritprvlwjqmzgfa.supabase.co",
  key: "sb_publishable_rVel3kRyAtyU9fkLaPR2vQ_rSCNLHJJ"
};
const COLLECTIONS = ["inventory","bins","movements","variances","interbranch","daily",
  "gatepass","gas","mda","machines","areas","branches","staff","counts","ivfs"];
const TB = k => "shb_" + k;

async function sb(path, opts={}){
  const { headers: extra, ...rest } = opts;
  const res = await fetch(SB.url + "/rest/v1/" + path, Object.assign({}, rest, {
    headers: Object.assign({
      "apikey": SB.key,
      "Authorization": "Bearer " + SB.key,
      "Content-Type": "application/json"
    }, extra || {})
  }));
  const body = await res.text();
  if(!res.ok) throw new Error("Supabase " + res.status + ": " + body.slice(0,300));
  return body ? JSON.parse(body) : null;
}
const stripId = r => { const o = Object.assign({}, r); delete o.id; return o; };
const rowIn  = r => Object.assign({}, r.data, {id: r.id});
const rowOut = r => ({ id: r.id, data: stripId(r), updated_at: new Date().toISOString() });

async function sbList(k){
  const page = 1000;
  let all = [], from = 0;
  while(true){
    const rows = await sb(TB(k) + "?select=id,data&order=updated_at.asc&limit=" + page + "&offset=" + from);
    all = all.concat(rows);
    if(rows.length < page) break;
    from += page;
  }
  return all.map(rowIn);
}
async function sbUpsert(k, row){
  await sb(TB(k), {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(rowOut(row))
  });
}
async function sbUpsertMany(k, rows){
  if(!rows.length) return;
  for(let i=0;i<rows.length;i+=200){
    await sb(TB(k), {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i,i+200).map(rowOut))
    });
  }
}
async function sbDelete(k, id){
  await sb(TB(k) + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers:{Prefer:"return=minimal"} });
}
async function sbDeleteMany(k, ids){
  for(let i=0;i<ids.length;i+=100){
    const list = ids.slice(i,i+100).map(id => '"' + String(id).replace(/"/g,'') + '"').join(",");
    await sb(TB(k) + "?id=in.(" + encodeURIComponent(list) + ")", { method:"DELETE", headers:{Prefer:"return=minimal"} });
  }
}
async function sbGetSetting(key){
  const rows = await sb("shb_settings?select=data&id=eq." + encodeURIComponent(key));
  return rows.length ? rows[0].data : null;
}
async function sbPutSetting(key, value){
  await sb("shb_settings", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify({ id: key, data: value, updated_at: new Date().toISOString() })
  });
}

let DB = blank();
let SHADOW = blank();
function blank(){
  const o = { binCardOpening:{}, meta:{created:TODAY(), version:2} };
  COLLECTIONS.forEach(k => o[k] = []);
  return o;
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }

function setSync(state){
  const d = document.getElementById("syncDot");
  if(!d) return;
  d.className = "syncdot " + (state||"");
  d.title = state==="ok" ? "All changes saved" : state==="busy" ? "Saving…" : state==="err" ? "Save failed — check connection" : "";
}

/* Pull every collection into memory. */
async function pullAll(){
  setSync("busy");
  const results = await Promise.all(COLLECTIONS.map(k => sbList(k)));
  COLLECTIONS.forEach((k,i)=> DB[k] = results[i]);
  DB.binCardOpening = (await sbGetSetting("binCardOpening")) || {};
  SHADOW = clone(DB);
  setSync("ok");
}

/* Diff current DB against SHADOW and push only what changed.
   Existing call sites keep calling save() unchanged. */
let saveChain = Promise.resolve();
function save(){
  saveChain = saveChain.then(doSave).catch(err=>{
    console.error(err); setSync("err");
    toast("Could not save to the server. Check your connection and try again.\n\n" + err.message);
  });
  return saveChain;
}
async function doSave(){
  setSync("busy");
  for(const k of COLLECTIONS){
    const cur = DB[k] || [];
    const prev = SHADOW[k] || [];
    const prevMap = new Map(prev.map(r => [r.id, JSON.stringify(r)]));
    const curIds = new Set(cur.map(r => r.id));
    const changed = cur.filter(r => prevMap.get(r.id) !== JSON.stringify(r));
    const removed = prev.filter(r => !curIds.has(r.id)).map(r => r.id);
    if(changed.length) await sbUpsertMany(k, changed);
    if(removed.length) await sbDeleteMany(k, removed);
  }
  if(JSON.stringify(DB.binCardOpening) !== JSON.stringify(SHADOW.binCardOpening)){
    await sbPutSetting("binCardOpening", DB.binCardOpening || {});
  }
  SHADOW = clone(DB);
  setSync("ok");
}

function applyStockDelta(sapCode, deltaIn, deltaOut){
  const it = findItem(sapCode);
  if(!it) return null;
  it.qty = num(it.qty) + num(deltaIn) - num(deltaOut);
  it.updatedAt = TODAY();
  return it.qty;
}

 * ============================================================ */
let route = "dashboard";
let globalArea = "";
const sortState = {}; // key -> {col,dir}

function badgeFor(key){
  const map={inventory:"inventory",bins:"bins",counts:"counts",variances:"variances",ivfs:"ivfs",
    movements:"movements",interbranch:"interbranch",daily:"daily",gatepass:"gatepass",gas:"gas",mda:"mda",
    machines:"machines",areas:"areas",branches:"branches",staff:"staff"};
  const arr = DB[map[key]];
  return Array.isArray(arr) ? arr.length : "";
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(sec=>`
    <div class="grp">${sec.grp}</div>
    ${sec.items.map(([k,label,ic])=>`
      <button data-route="${k}" class="${route===k?'active':''}">
        <span class="ic">${ic}</span><span>${label}</span>
        ${badgeFor(k)!==""?`<span class="badge">${badgeFor(k)}</span>`:""}
      </button>`).join("")}
  `).join("");
  nav.querySelectorAll("button[data-route]").forEach(b=>{
    b.onclick=()=>{ route=b.dataset.route; renderNav(); renderRoute(); window.scrollTo(0,0); };
  });
}

function fillGlobalArea(){
  const sel = document.getElementById("globalArea");
  const cur = globalArea;
  sel.innerHTML = `<option value="">All areas</option>` + areaNames().map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join("");
}

function renderRoute(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(route==="dashboard") return renderDashboard(app);
  if(route==="bincard") return renderBinCard(app);
  if(route==="counts") return renderCounts(app);
  if(route==="countsummary") return renderCountSummary(app);
  if(route==="ivfs") return renderIVFs(app);
  if(route==="overtime"){ app.innerHTML = OT_LOADING; renderOvertimeSheet(app); return; }
  if(route==="overtime_summary"){ app.innerHTML = OT_LOADING; renderOvertimeSummary(app); return; }
  if(route==="overtime_approvals"){ app.innerHTML = OT_LOADING; renderOvertimeApprovals(app); return; }
  if(route==="overtime_staff"){ app.innerHTML = OT_LOADING; renderOvertimeStaff(app); return; }
  if(route==="leave"){ app.innerHTML = OT_LOADING; renderLeaveSchedule(app); return; }
  if(route==="leave_approvals"){ app.innerHTML = OT_LOADING; renderLeaveApprovals(app); return; }
  return renderCollection(app, route);
}

/* ============================================================ *
 *  GENERIC COLLECTION VIEW
 * ============================================================ */
function renderCollection(app, key){
  const sc = SCHEMAS[key];
  if(!sc){ app.innerHTML="<div class='empty'>Unknown screen.</div>"; return; }
  const search = (sortState[key+'_q']||"");
  let invSelectMode = false;
  const invSelected = new Set();
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="page-h"><h2>${sc.icon} ${esc(sc.label)}</h2></div>
    <p class="mini">${collDesc(key)}</p>
    <div class="toolbar">
      ${key==="inventory"?`<button class="btn" id="sendCount" style="display:none">Send For Count</button>`:""}
      <button class="btn" id="add">+ New ${esc(sc.singular)}</button>
      <input type="search" id="q" placeholder="Search…" value="${esc(search)}"/>
      ${sc.areaField?`<select id="areaf"><option value="">All areas</option>${areaNames().map(a=>`<option ${a===globalArea?'selected':''}>${esc(a)}</option>`).join("")}</select>`:""}
      <button class="btn sec sm" id="imp">Import CSV</button>
      <button class="btn sec sm" id="exp">Export CSV</button>
      ${key==="inventory"?`<button class="btn sec sm" id="selCount">Select Items to count</button>`:""}
      <button class="btn ghost sm" id="prn">Print</button>
      <span class="count" id="cnt"></span>
    </div>
    <div class="panel"><div class="tablewrap" id="tw"></div></div>
    <div id="summary"></div>
  `;
  app.appendChild(wrap);

  const draw = ()=>{
    if(key==="inventory"){
      const selBtn = wrap.querySelector("#selCount");
      if(selBtn) selBtn.textContent = invSelectMode ? "Cancel selection" : "Select Items to count";
      const sendBtn = wrap.querySelector("#sendCount");
      if(sendBtn){
        sendBtn.style.display = invSelectMode ? "" : "none";
        sendBtn.textContent = `Send For Count (${invSelected.size})`;
        sendBtn.disabled = !invSelected.size;
      }
    }
    const q = (document.getElementById("q").value||"").toLowerCase();
    sortState[key+'_q']=q;
    const af = sc.areaField ? (document.getElementById("areaf")?.value||"") : "";
    let rows = DB[key].slice();
    if(sc.areaField && af) rows = rows.filter(r=>r[sc.areaField]===af);
    if(q) rows = rows.filter(r=>Object.values(r).some(v=>String(v==null?"":v).toLowerCase().includes(q)));
    const s = sortState[key];
    if(s){
      rows.sort((a,b)=>{
        let av=a[s.col], bv=b[s.col];
        const col = sc.cols.find(c=>c.key===s.col);
        if(col && col.type==="computed") { av=col.compute(a); bv=col.compute(b); }
        const an=parseFloat(av), bn=parseFloat(bv);
        let r;
        if(!isNaN(an)&&!isNaN(bn)) r=an-bn; else r=String(av==null?"":av).localeCompare(String(bv==null?"":bv));
        return s.dir==="desc"?-r:r;
      });
    }
    document.getElementById("cnt").textContent = `${rows.length} of ${DB[key].length}`;
    const cols = sc.cols;
    const tw = document.getElementById("tw");
    if(!rows.length){ tw.innerHTML = `<div class="empty">No records. Click “+ New ${esc(sc.singular)}” or Import CSV.</div>`; }
    else if(key==="inventory" && invSelectMode){
      tw.innerHTML = `<table class="grid"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r=>`<tr data-id="${r.id}"><td><input type="checkbox" data-selchk="${r.id}" ${invSelected.has(r.id)?"checked":""}></td>${cols.map(c=>cellHTML(c,r)).join("")}</tr>`).join("")}</tbody></table>`;
      tw.querySelectorAll("[data-selchk]").forEach(cb=>{
        cb.onchange = ()=>{
          if(cb.checked) invSelected.add(cb.dataset.selchk); else invSelected.delete(cb.dataset.selchk);
          const sendBtn = wrap.querySelector("#sendCount");
          sendBtn.textContent = `Send For Count (${invSelected.size})`;
          sendBtn.disabled = !invSelected.size;
        };
      });
      tw.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=e=>{
        if(e.target.matches('input[type="checkbox"]')) return;
        const cb = tr.querySelector("[data-selchk]");
        cb.checked = !cb.checked; cb.dispatchEvent(new Event("change"));
      });
    }
    else{
      const canEditRow = key!=="inventory" || canManageInventory();
      tw.innerHTML = `<table class="grid"><thead><tr>${cols.map(c=>`<th data-c="${c.key}">${esc(c.label)}${sortState[key]&&sortState[key].col===c.key?(sortState[key].dir==="desc"?" ▾":" ▴"):""}</th>`).join("")}<th></th></tr></thead>
        <tbody>${rows.map(r=>`<tr data-id="${r.id}">${cols.map(c=>cellHTML(c,r)).join("")}<td class="no-print">${((key==="counts" && !canDeleteCounts())||(key==="inventory" && !canManageInventory()))?`<span class="mini" title="Supervisor or Manager only">🔒</span>`:`<button class="btn danger sm" data-del="${r.id}">✕</button>`}</td></tr>`).join("")}</tbody></table>`;
      tw.querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{
        const c=th.dataset.c; const s=sortState[key];
        sortState[key]= s&&s.col===c ? {col:c,dir:s.dir==="asc"?"desc":"asc"} : {col:c,dir:"asc"};
        draw();
      });
      tw.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=e=>{
        if(e.target.closest("[data-del]")) return;
        if(!canEditRow){ alert("Editing inventory needs a Supervisor or Manager role.\nYou are signed in as: "+currentRole()); return; }
        openForm(key, DB[key].find(x=>x.id===tr.dataset.id));
      });
      tw.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{
        e.stopPropagation();
        if(key==="counts" && !canDeleteCounts()){ alert("Only a Supervisor or Manager can delete a count record.\nYou are signed in as: "+currentRole()); return; }
        if(key==="inventory" && !canManageInventory()){ alert("Only a Supervisor or Manager can delete an inventory item.\nYou are signed in as: "+currentRole()); return; }
        if(confirm("Delete this record?")){ DB[key]=DB[key].filter(x=>x.id!==b.dataset.del); save(); renderNav(); draw(); drawSummary(); }
      });
    }
    drawSummary();
  };
  const drawSummary = ()=>{
    const box = document.getElementById("summary");
    if(sc.summary==="interbranch") box.innerHTML = interbranchSummaryHTML();
    else if(sc.summary==="daily") box.innerHTML = dailySummaryHTML();
    else box.innerHTML="";
  };

  wrap.querySelector("#add").onclick = ()=>openForm(key,null);
  wrap.querySelector("#q").oninput = draw;
  if(wrap.querySelector("#areaf")) wrap.querySelector("#areaf").onchange = e=>{ globalArea=e.target.value; document.getElementById("globalArea").value=globalArea; draw(); };
  wrap.querySelector("#exp").onclick = ()=>exportCSV(key);
  wrap.querySelector("#imp").onclick = ()=>importCSV(key, draw);
  wrap.querySelector("#prn").onclick = ()=>printCollection(key);
  if(key==="inventory"){
    wrap.querySelector("#selCount").onclick = ()=>{
      invSelectMode = !invSelectMode;
      if(!invSelectMode) invSelected.clear();
      draw();
    };
    wrap.querySelector("#sendCount").onclick = ()=>{
      if(!invSelected.size) return;
      const items = DB.inventory.filter(i=>invSelected.has(i.id));
      const t=TODAY(), wk=weekOf(t), mo=monthOf(t);
      items.slice().reverse().forEach(it=>{
        DB.counts.unshift({id:uid(),countDate:t,week:wk,month:mo,
          sapCode:it.sapCode,description:it.description||"",partNo:it.mpn||"",uom:it.uom||"",invType:it.group||"",
          counter:"",machine:it.machine||"",counted:"",sapQty:it.qty,resolved:"",resolvedOn:"",resolutionRemarks:"",remarks:""});
      });
      save(); renderNav();
      const n=items.length;
      invSelectMode=false; invSelected.clear();
      alert(`${n} item(s) sent for counting — now at the top of the Inventory Count Tracker.`);
      route="counts"; renderNav(); renderRoute();
    };
  }
  draw();
}

function collDesc(key){
  return ({
    inventory:"Full item register across every store and branch. Re-order and Over-Max flags are calculated from Min / Max. Editing or deleting an item needs a Supervisor or Manager role. Use “Select Items to count” to tick items and send them to the top of the Inventory Count Tracker.",
    bins:"Every bin location with the items and quantity it holds.",
    counts:"One row per material counted. Week, Month, Description, Part No, UOM, Machine and Inventory Type pre-fill when you pick a Material Code. Variance = Counted − SAP Quantity; Status shows “Counted” when they match, otherwise “Variance”. Only a Supervisor or Manager can delete a row.",
    movements:"Every stock transaction. Saving a movement updates the item’s On-Hand quantity and feeds the Bin Card.",
    variances:"Consolidated count differences from cycle counts, IVFs and spot checks — value and status.",
    interbranch:"Transfers between GZI SA, Agbara, Aba and Kenya with value roll-up per route.",
    daily:"Open / closed store issues with ageing. Anything over 5 days open is flagged.",
    gatepass:"Returnable and non-returnable items leaving site.",
    gas:"Gas bottle receipts, issues and empty returns by mass.",
    mda:"Requests to add / amend / obsolete material master data, with the approval chain.",
    machines:"SAP prefix → machine name lookup used across the program.",
    areas:"Storage areas / sub-stores.",
    branches:"Plants in the group.",
    staff:"People who raise, action and sign for stock.",
  })[key]||"";
}

function cellHTML(c,r){
  let v = c.type==="computed" ? c.compute(r) : r[c.key];
  if(c.type==="computed" && c.pill){ return `<td><span class="pill ${c.pill(v)}">${esc(c.fmt?c.fmt(v):v)}</span></td>`; }
  if(c.type==="money") return `<td class="num">${money(v)}</td>`;
  if(c.type==="number") return `<td class="num">${v===""||v==null?"":int(v)}</td>`;
  if(c.type==="computed" && c.fmt) return `<td class="num">${esc(c.fmt(v))}</td>`;
  if(c.key==="status"){ return `<td><span class="pill ${statusPill(v)}">${esc(v||"")}</span></td>`; }
  let s = String(v==null?"":v);
  if(s.length>60) s = s.slice(0,58)+"…";
  return `<td>${esc(s)}</td>`;
}
function statusPill(v){
  v=String(v||"").toLowerCase();
  if(/(closed|processed|approved|active|adjusted|returned|loaded)/.test(v)) return "ok";
  if(/(pending|open|draft|submitted|investigat|progress|sent out)/.test(v)) return "warn";
  if(/(cancel|reject|damaged|obsolete|loss)/.test(v)) return "bad";
  return "mut";
}

/* ============================================================ *
 *  GENERIC ADD / EDIT FORM
 * ============================================================ */
function openForm(key, rec){
  const sc = SCHEMAS[key];
  const isNew = !rec;
  const data = rec ? JSON.parse(JSON.stringify(rec)) : defaultRecord(key);
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-back">
      <div class="modal">
        <h3>${isNew?"New":"Edit"} ${esc(sc.singular)}</h3>
        <div class="body"><div class="formgrid" id="fg"></div>
          ${sc.posts?`<p class="hintline">Saving posts this movement: On-Hand for the item becomes <b id="prev">–</b>. Bin Card updates automatically.</p>`:""}
        </div>
        <div class="foot">
          <button class="btn" id="save">Save</button>
          <button class="btn ghost" id="cancel">Cancel</button>
          ${(!isNew && !(key==="counts" && !canDeleteCounts()))?`<button class="btn danger right" id="del">Delete</button>`:""}
        </div>
      </div>
    </div>`;
  const fg = root.querySelector("#fg");
  sc.cols.forEach(c=>{
    if(c.type==="computed" && c.tableOnly) return;
    const id = "f_"+c.key;
    const wide = (c.type==="textarea"||c.grow) ? " wide":"";
    let field="";
    const val = data[c.key]==null?"":data[c.key];
    if(c.type==="textarea") field = `<textarea id="${id}" ${c.ro?"disabled":""}>${esc(val)}</textarea>`;
    else if(c.type==="select"){
      const opts = (typeof c.options==="function"?c.options():c.options)||[];
      field = `<select id="${id}" ${c.ro?"disabled":""}><option value=""></option>${opts.map(o=>`<option ${String(o)===String(val)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    }
    else if(c.type==="lookup"){
      const opts=(typeof c.options==="function"?c.options():c.options)||[];
      field = `<input id="${id}" list="dl_${c.key}" value="${esc(val)}" ${c.ro?"disabled":""}/><datalist id="dl_${c.key}">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`;
    }
    else {
      const t = c.type==="date"?"date":(c.type==="number"||c.type==="money")?"number":"text";
      const step = c.type==="money"?' step="0.01"':(c.type==="number"?' step="any"':"");
      field = `<input id="${id}" type="${t}"${step} value="${esc(val)}" ${c.ro?"disabled":""}/>`;
    }
    fg.insertAdjacentHTML("beforeend",
      `<div class="fld${wide}"><label for="${id}">${esc(c.label)}${c.req?" *":""}</label>${field}</div>`);
  });

  // SAP code auto-fill for lookup-bearing schemas
  const codeField = fg.querySelector("#f_sapCode");
  if(codeField){
    const fill = ()=>{
      const it = findItem(codeField.value);
      if(!it) return;
      const map = {description:"description",machine:"machine",area:"area",bin:"bin",unitCost:"unitCost",
        partNo:"mpn",min:"min",max:"max",uom:"uom"};
      Object.entries(map).forEach(([f,src])=>{
        const el = fg.querySelector("#f_"+f);
        if(el && !el.value) el.value = it[src]==null?"":it[src];
      });
      const bs = fg.querySelector("#f_balanceSap"); if(bs && !bs.value) bs.value = it.qty;
      const sy = fg.querySelector("#f_system"); if(sy && !sy.value) sy.value = it.qty;
      const sq = fg.querySelector("#f_sapQty"); if(sq && !sq.value) sq.value = it.qty;
      const ivt = fg.querySelector("#f_invType"); if(ivt && !ivt.value) ivt.value = it.group==null?"":it.group;
      updatePrev();
    };
    codeField.addEventListener("change", fill);
    codeField.addEventListener("blur", fill);
  }

  // Inventory Count Tracker: keep Week / Month in step with Count Date
  if(key==="counts"){
    const dref=fg.querySelector("#f_countDate"), wref=fg.querySelector("#f_week"), mref=fg.querySelector("#f_month");
    if(dref){
      const sync=()=>{ if(wref) wref.value=weekOf(dref.value); if(mref) mref.value=monthOf(dref.value); };
      dref.addEventListener("change",sync);
      if(isNew && !dref.value){ dref.value=TODAY(); sync(); }
      else if(isNew){ sync(); }
    }
  }

  function updatePrev(){
    if(!sc.posts) return;
    const it = findItem(fg.querySelector("#f_sapCode")?.value);
    const pin = num(fg.querySelector("#f_qtyIn")?.value), pout = num(fg.querySelector("#f_qtyOut")?.value);
    const el = root.querySelector("#prev");
    if(el) el.textContent = it ? int(num(it.qty)+pin-pout) + " " + (it.uom||"") : "(item not in register)";
  }
  ["#f_qtyIn","#f_qtyOut"].forEach(s=>{ const el=fg.querySelector(s); if(el) el.addEventListener("input",updatePrev); });
  updatePrev();

  root.querySelector("#cancel").onclick = closeModal;
  root.querySelector(".modal-back").onclick = e=>{ if(e.target.classList.contains("modal-back")) closeModal(); };
  if(root.querySelector("#del")) root.querySelector("#del").onclick = ()=>{
    if(key==="counts" && !canDeleteCounts()){ alert("Only a Supervisor or Manager can delete a count record.\nYou are signed in as: "+currentRole()); return; }
    if(confirm("Delete this record?")){ DB[key]=DB[key].filter(x=>x.id!==rec.id); save(); closeModal(); renderNav(); renderRoute(); }
  };
  root.querySelector("#save").onclick = ()=>{
    const out = Object.assign({}, data);
    sc.cols.forEach(c=>{
      if(c.type==="computed" && c.tableOnly) return;
      const el = fg.querySelector("#f_"+c.key);
      if(!el) return;
      let v = el.value;
      if(c.type==="number"||c.type==="money") v = v===""?"":num(v);
      out[c.key]=v;
    });
    for(const c of sc.cols){ if(c.req && (out[c.key]===""||out[c.key]==null)){ alert(c.label+" is required."); return; } }

    if(isNew){
      out.id = uid();
      if(sc.cols.some(c=>c.key==="sn")) out.sn = (DB[key].reduce((m,r)=>Math.max(m,num(r.sn)),0)||0)+1;
      if(sc.cols.some(c=>c.key==="lineNo")) out.lineNo = (DB[key].reduce((m,r)=>Math.max(m,num(r.lineNo)),0)||0)+1;
    }
    if(key==="inventory") out.updatedAt = TODAY();

    // posting side-effects for movement tracker
    if(sc.posts){
      const before = out.id;
      // reverse a previous post if editing
      if(!isNew && rec) applyStockDelta(rec.sapCode, rec.qtyOut, rec.qtyIn); // undo old
      const newBal = applyStockDelta(out.sapCode, out.qtyIn, out.qtyOut);
      out.balance = newBal==null ? num(out.balance) : newBal;
      if(newBal==null) toast("Saved. Note: "+out.sapCode+" is not in the Inventory register, so On-Hand was not updated.");
    }

    if(isNew) DB[key].push(out);
    else DB[key] = DB[key].map(x=>x.id===rec.id?out:x);
    save(); closeModal(); renderNav(); renderRoute();
  };
}
function defaultRecord(key){
  const sc = SCHEMAS[key]; const o = {};
  sc.cols.forEach(c=>{ o[c.key] = (c.type==="number"||c.type==="money")?0:""; });
  if("date" in o) o.date = TODAY();
  if("openDate" in o) o.openDate = TODAY();
  if("countDate" in o) o.countDate = TODAY();
  if(key==="inventory"){ o.branch="GZI SA"; o.sloc="6080"; o.uom="PC"; if(globalArea) o.area=globalArea; }
  if(key==="movements"){ o.shift="Day"; o.type="Issue"; if(globalArea) o.area=globalArea; }
  if(key==="interbranch"){ o.fromPlant="GZI SA"; o.status="Pending"; o.week=weekOf(TODAY()); }
  if(key==="daily"){ o.status="Open"; }
  if(key==="bins" && globalArea) o.area=globalArea;
  if(key==="counts"){ o.week=weekOf(TODAY()); o.month=monthOf(TODAY()); o.counted=""; o.sapQty=""; }
  return o;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function toast(msg){ alert(msg); }

/* ============================================================ *
 *  DASHBOARD
 * ============================================================ */
function renderDashboard(app){
  const inv = DB.inventory;
  const areaFilter = globalArea ? inv.filter(i=>i.area===globalArea) : inv;
  const sohValue = areaFilter.reduce((a,i)=>a+num(i.qty)*num(i.unitCost),0);
  const reorder = areaFilter.filter(i=>num(i.qty)<=num(i.min) && (num(i.min)>0||num(i.max)>0));
  const overMax = areaFilter.filter(i=>num(i.max)>0 && num(i.qty)>num(i.max));
  const overMaxVal = overMax.reduce((a,i)=>a+(num(i.qty)-num(i.max))*num(i.unitCost),0);
  const noMove = areaFilter.filter(i=>/no movement/i.test(i.status));
  const emptyBins = DB.bins.filter(b=> DB.inventory.filter(i=>i.bin===b.code).reduce((a,i)=>a+num(i.qty),0)===0 );
  const openVar = DB.variances.filter(v=>/open|investigat/i.test(v.status));
  const openXfer = DB.interbranch.filter(t=>!/fully processed|cancelled/i.test(t.status));
  const openIssues = DB.daily.filter(d=>!/closed/i.test(d.status));
  const agedIssues = openIssues.filter(d=>daysBetween(d.openDate,null)>5);

  app.innerHTML = `
    <div class="page-h"><h2>📊 Dashboard</h2><p>${globalArea?("Filtered: "+esc(globalArea)):"All areas"} · ${DB.inventory.length} items on register</p></div>

function interbranchSummaryHTML(compact){

function dailySummaryHTML(compact){

/* ============================================================ *
 *  INVENTORY COUNT TRACKER  (flat register — friendly view)
 * ============================================================ */
let countsUI = { week:"", machine:"", statusFilter:"", q:"" };

function isResolved(r){ return r.resolved===true || /^(y|yes|true|1|resolved)$/i.test(String(r.resolved||"")); }
function countStatus(r){
  if(r.counted===""||r.counted==null) return "Pending";
  if(num(r.counted)===num(r.sapQty)) return "Counted";
  return isResolved(r) ? "Resolved" : "Variance";   // a variance is NOT "counted" until it is resolved
}
function countVariance(r){
  return (r.counted===""||r.counted==null) ? "" : num(r.counted)-num(r.sapQty);
}
function timesCounted(r){
  const code = String(r.sapCode||"").trim().toUpperCase();
  if(!code) return 0;
  return DB.counts.filter(x=>String(x.sapCode||"").trim().toUpperCase()===code).length;
}
function stPillClass(st){ return (st==="Counted"||st==="Resolved")?"ok":st==="Variance"?"bad":"warn"; }

/* Aggregate a set of count rows for the summary sheet / KPIs.
   counted  = exact matches + resolved variances (what may be reported as done)
   outstanding = still to count + unresolved variances
   accuracy = physical matched the system first time (resolved still counts as a miss) */
function countStats(rows){
  let exact=0,resolved=0,pending=0,variance=0;
  rows.forEach(r=>{
    const st=countStatus(r);
    if(st==="Counted") exact++;
    else if(st==="Resolved") resolved++;
    else if(st==="Variance") variance++;
    else pending++;
  });
  const total=rows.length, counted=exact+resolved, outstanding=pending+variance, attempted=exact+resolved+variance;
  return { total,exact,resolved,pending,variance,counted,outstanding,attempted,
    pctCounted: total?Math.round(counted/total*100):0,
    accuracy: attempted?Math.round(exact/attempted*100):0 };
}
function resolveCellHTML(r){
  const st=countStatus(r);
  if(st==="Variance"||st==="Resolved")
    return `<label class="mini" style="white-space:nowrap"><input type="checkbox" data-k="resolved" ${isResolved(r)?"checked":""}> ${isResolved(r)?esc(r.resolvedOn||"yes"):"resolve"}</label>`;
  return `<span class="mini">—</span>`;
}
/* period bucketing for the summary sheet */
function csGrainLabel(g){ return {day:"Day",week:"Week",month:"Month",year:"Year"}[g]||"Period"; }
function mondayOf(d){ const dt=new Date(String(d).slice(0,10)+"T00:00:00"); if(isNaN(dt)) return String(d||""); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off); return dt.toISOString().slice(0,10); }
function csBucket(r,grain){
  const d=String(r.countDate||"").slice(0,10);
  if(!d) return {key:"",label:"(no date)"};
  if(grain==="day")  return {key:d,label:d};
  if(grain==="week") { const m=mondayOf(d); return {key:m,label:"Wk of "+m}; }
  if(grain==="year") return {key:d.slice(0,4),label:d.slice(0,4)};
  return {key:d.slice(0,7),label:monthOf(d)};
}

    const haveCount = {};
    DB.counts.filter(r=>r.countDate===date).forEach(r=>{
      const k=String(r.sapCode||"").toUpperCase(); haveCount[k]=(haveCount[k]||0)+1;
    });
    let added=0, alreadyDouble=0;
    pool.forEach(i=>{
      const k=String(i.sapCode||"").toUpperCase();
      const have=haveCount[k]||0;
      if(have>=2){ alreadyDouble++; return; }
      // rows still needed for this item — counter1 does the 1st count, counter2 the 2nd
      const toAdd = [counter1,counter2].slice(have);
      toAdd.forEach(counter=>{
        DB.counts.push({id:uid(),countDate:date,week:wk,month:mo,
          sapCode:i.sapCode,description:i.description||"",partNo:i.mpn||"",uom:i.uom||"",invType:i.group||"",
          counter,machine:i.machine||"",counted:"",sapQty:i.qty,resolved:"",resolvedOn:"",resolutionRemarks:"",remarks:""});
        added++;
      });
    });
    save(); renderNav();
    const parts=[];
    if(added) parts.push(`${added} count row(s) added`);
    if(alreadyDouble) parts.push(`${alreadyDouble} item(s) already had 2 counts for ${date}`);
    alert(parts.length ? parts.join("; ")+" — "+(machine.trim()||"all machines")+"." : `Nothing added — those items are already double-counted for ${date}.`);
    drawKPIs(); drawTable();
  };
  app.querySelector("#imp").onclick = ()=>importCSV("counts", ()=>renderCounts(app));
  app.querySelector("#exp").onclick = ()=>exportCSV("counts");
  app.querySelector("#prn").onclick = ()=>printCount(visible());
  app.querySelector("#f_week").onchange = e=>{ countsUI.week=e.target.value; drawKPIs(); drawTable(); };
  app.querySelector("#f_machine").onchange = e=>{ countsUI.machine=e.target.value; drawKPIs(); drawTable(); };
  app.querySelector("#f_q").oninput = e=>{ countsUI.q=e.target.value; drawTable(); };
  app.querySelectorAll("#f_status [data-s]").forEach(b=>b.onclick=()=>{ countsUI.statusFilter=b.dataset.s; markSeg(); drawTable(); });

  drawKPIs(); drawTable();
}

/* ============================================================ *
 *  INVENTORY COUNT SUMMARY  (separate sheet)
 *  Items counted vs outstanding by day / week / month / year and
 *  per machine, with % counted and count-accuracy %. A variance
 *  only becomes "counted" once it is flagged Resolved.
 * ============================================================ */
let csUI = { grain:"month", period:"" };

function csStatRow(label, s, withVar, linkMachine){
  const acc = s.attempted ? s.accuracy+"%" : "—";
  const pc  = s.total ? s.pctCounted+"%" : "—";
  const remPc = s.total ? (100-s.pctCounted)+"%" : "—";
  const labelCell = linkMachine
    ? `<span class="link" data-machine="${esc(label)}" style="cursor:pointer;color:var(--brand);font-weight:600">${esc(label)}</span>`
    : esc(label);
  return `<tr>
    <td>${labelCell}</td>
    <td class="num">${s.total}</td>
    <td class="num">${s.counted}</td>
    <td class="num">${s.outstanding}</td>
    <td class="num">${remPc}</td>
    <td class="num"><span class="pill ${s.pctCounted>=95?'ok':s.pctCounted>=60?'warn':'bad'}">${pc}</span></td>
    <td class="num"><span class="pill ${s.accuracy>=95?'ok':s.accuracy>=80?'warn':'bad'}">${acc}</span></td>
    ${withVar?`<td class="num">${s.variance||""}</td>`:""}
  </tr>`;
}
function csTotalRow(label, s, withVar){
  return `<tr style="border-top:2px solid var(--line)"><td><b>${esc(label)}</b></td>
    <td class="num"><b>${s.total}</b></td><td class="num"><b>${s.counted}</b></td><td class="num"><b>${s.outstanding}</b></td>
    <td class="num"><b>${s.total?(100-s.pctCounted)+"%":"—"}</b></td>
    <td class="num"><b>${s.total?s.pctCounted+"%":"—"}</b></td><td class="num"><b>${s.attempted?s.accuracy+"%":"—"}</b></td>
    ${withVar?`<td class="num"><b>${s.variance||""}</b></td>`:""}</tr>`;
}

function csBuild(){
  const grain = csUI.grain;
  const buckets = new Map();
  DB.counts.forEach(r=>{
    const b = csBucket(r,grain);
    if(!buckets.has(b.key)) buckets.set(b.key,{label:b.label,rows:[]});
    buckets.get(b.key).rows.push(r);
  });
  const list = [...buckets.entries()].sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  if(csUI.period && !buckets.has(csUI.period)) csUI.period = "";
  const periodRows  = csUI.period ? buckets.get(csUI.period).rows : DB.counts.slice();
  const periodLabel = csUI.period ? buckets.get(csUI.period).label : "All time";
  return { grain, buckets, list, periodRows, periodLabel };
}

        <tbody>
          ${machineStats.length ? machineStats.map(([m,s])=>csStatRow(m,s,true,true)).join("") : `<tr><td colspan="8" class="empty">Nothing counted in this period.</td></tr>`}

        ${machineStats.map(([m,s])=>`<div style="margin:8px 0">
          <div class="flex"><span class="link" data-machine="${esc(m)}" style="cursor:pointer;color:var(--brand);font-weight:600">${esc(m)}</span><span class="right mini">${s.counted}/${s.total} counted${s.variance?` · ${s.variance} open`:""} · acc ${s.attempted?s.accuracy+"%":"—"}</span></div>

    const lines=[head.join(",")].concat(machineStats.map(([m,s])=>
      [`"${String(m).replace(/"/g,'""')}"`,s.total,s.counted,s.outstanding,s.pctCounted,s.accuracy,s.variance].join(",")));
    lines.push([`"All machines"`,S.total,S.counted,S.outstanding,S.pctCounted,S.accuracy,S.variance].join(","));
    const blob=new Blob([lines.join("\n")],{type:"text/csv"});

function renderIVFs(app){
  app.innerHTML = `
    <div class="page-h"><h2>✅ Inventory Verification Form (IVF)</h2><p>Structured verification with compliance %, re-order status and PR/PO count. Printable.</p></div>
    <div class="toolbar no-print"><button class="btn" id="new">+ New IVF</button><span class="count">${DB.ivfs.length} form(s)</span></div>
    <div class="panel"><div class="tablewrap"><table class="grid">
      <thead><tr><th>Date</th><th>Verified By</th><th>Shift</th><th class="num">Items</th><th class="num">Accurate</th><th class="num">Inaccurate</th><th class="num">Compliance</th><th class="num">Re-order (PR/PO)</th></tr></thead>
      <tbody>${DB.ivfs.length?DB.ivfs.map(f=>{const k=ivfKPI(f);return `<tr data-id="${f.id}"><td>${esc(f.date)}</td><td>${esc(f.verifiedBy||"")}</td><td>${esc(f.shift||"")}</td><td class="num">${k.total}</td><td class="num">${k.acc}</td><td class="num">${k.inacc}</td><td class="num"><span class="pill ${k.pct>=95?'ok':k.pct>=80?'warn':'bad'}">${k.pct}%</span></td><td class="num">${k.reorder}</td></tr>`;}).join(""):`<tr><td colspan="8" class="empty">No IVFs yet.</td></tr>`}</tbody>
    </table></div></div>`;
  app.querySelector("#new").onclick=()=>{ const f={id:uid(),date:TODAY(),verifiedBy:"",shift:"",signature:"",lines:[]}; DB.ivfs.push(f); save(); editIVF(f.id); };
  app.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=()=>editIVF(tr.dataset.id));
}
function ivfKPI(f){
  const done = f.lines.filter(l=>l.physical!=="" && l.physical!=null);
  const acc = done.filter(l=>num(l.physical)-num(l.sapQty)===0).length;
  const inacc = done.length-acc;
  const pct = done.length? Math.round(acc/done.length*100) : 0;
  const reorder = f.lines.filter(l=>num(l.physical)<=num(l.min) && (num(l.min)>0||num(l.max)>0)).length;
  const emptyBins = f.lines.filter(l=>num(l.physical)===0).length;
  return {total:f.lines.length,acc,inacc,pct,reorder,emptyBins};
}
function editIVF(id){
  const f = DB.ivfs.find(x=>x.id===id);
  const app = document.getElementById("app");
  const draw = ()=>{
    const k = ivfKPI(f);
    app.innerHTML = `

    f.lines.forEach((l,idx)=>{
      const v = (l.physical===""||l.physical==null)?"" : num(l.physical)-num(l.sapQty);
      const ro = (num(l.physical)<=num(l.min) && (num(l.min)>0||num(l.max)>0)) ? "Yes — re-order" : "Do not order";
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${idx+1}</td>
        <td><input type="date" value="${esc(l.date||f.date)}" data-k="date"></td>
        <td><input value="${esc(l.materialCode||"")}" data-k="materialCode" list="ivfcodes"></td>
        <td><input value="${esc(l.description||"")}" data-k="description"></td>
        <td><input class="num" type="number" value="${esc(l.min)}" data-k="min" style="width:56px"></td>
        <td><input class="num" type="number" value="${esc(l.max)}" data-k="max" style="width:56px"></td>
        <td><select data-k="movementType"><option value=""></option>${MOVE_TYPES.map(m=>`<option ${m===l.movementType?"selected":""}>${esc(m)}</option>`).join("")}</select></td>
        <td><input value="${esc(l.location||"")}" data-k="location"></td>
        <td><input class="num" type="number" value="${esc(l.physical)}" data-k="physical" style="width:66px"></td>
        <td><input class="num" type="number" value="${esc(l.sapQty)}" data-k="sapQty" style="width:66px"></td>
        <td class="num" style="${v!==""&&v!==0?'color:var(--danger);font-weight:700':''}">${v}</td>
        <td><span class="pill ${ro.startsWith('Yes')?'bad':'mut'}">${ro}</span></td>
        <td><input class="num" type="number" value="${esc(l.reorderQty)}" data-k="reorderQty" style="width:66px"></td>
        <td><input value="${esc(l.txnAudit||"")}" data-k="txnAudit"></td>
        <td><input value="${esc(l.remarks||"")}" data-k="remarks"></td>
        <td><button class="rowdel">✕</button></td>`;
      tr.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{
        l[el.dataset.k] = el.type==="number" ? (el.value===""?"":num(el.value)) : el.value;
        if(el.dataset.k==="materialCode"){ const it=findItem(el.value); if(it){ l.description=it.description;l.min=it.min;l.max=it.max;l.location=it.bin;l.sapQty=it.qty; save(); draw(); return; } }
        save(); draw();
      }));
      tr.querySelector(".rowdel").onclick=()=>{ f.lines.splice(idx,1); save(); draw(); };
      tb.appendChild(tr);
    });
    if(!app.querySelector("#ivfcodes")) app.insertAdjacentHTML("beforeend",`<datalist id="ivfcodes">${DB.inventory.map(i=>`<option value="${esc(i.sapCode)}">${esc(i.description)}</option>`).join("")}</datalist>`);
    const bind=(sel,prop)=>{ const el=app.querySelector(sel); el.addEventListener("input",()=>{ f[prop]=el.value; save(); if(prop==="date") draw(); }); };
    bind("#h_date","date");bind("#h_by","verifiedBy");bind("#h_shift","shift");bind("#h_sig","signature");
    app.querySelector("#back").onclick=()=>renderIVFs(app);
    app.querySelector("#addl").onclick=()=>{ f.lines.push({id:uid(),no:f.lines.length+1,date:f.date,materialCode:"",description:"",min:"",max:"",movementType:"",location:"",physical:"",sapQty:"",reorderQty:"",txnAudit:"",remarks:""}); save(); draw(); };
    app.querySelector("#addFromInv").onclick=()=>{
      const area = prompt("Add items from which area? (leave blank for all"+(globalArea?", current: "+globalArea:"")+")", globalArea||"");
      if(area===null) return;
      let pool = DB.inventory.slice();
      if(area) pool = pool.filter(i=>i.area.toLowerCase()===area.toLowerCase());
      const have=new Set(f.lines.map(l=>l.materialCode));
      pool.forEach(i=>{ if(have.has(i.sapCode))return; f.lines.push({id:uid(),no:f.lines.length+1,date:f.date,materialCode:i.sapCode,description:i.description,min:i.min,max:i.max,movementType:"",location:i.bin,physical:"",sapQty:i.qty,reorderQty:"",txnAudit:"",remarks:""}); });
      save(); draw();
    };
    app.querySelector("#postVar").onclick=()=>{
      const bad = f.lines.filter(l=>l.physical!=="" && num(l.physical)-num(l.sapQty)!==0);
      if(!bad.length){ alert("No inaccurate lines."); return; }
      bad.forEach(l=>{ const it=findItem(l.materialCode);
        DB.variances.push({id:uid(),date:f.date,source:"IVF",sapCode:l.materialCode,description:l.description,bin:l.location,
          physical:num(l.physical),system:num(l.sapQty),unitCost:it?num(it.unitCost):0,reason:"Under investigation",status:"Open",raisedBy:f.verifiedBy,remarks:"From IVF "+f.date});
      });
      save(); renderNav(); alert(bad.length+" line(s) added to the Variance Report.");
    };
    app.querySelector("#del").onclick=()=>{ if(confirm("Delete this IVF?")){ DB.ivfs=DB.ivfs.filter(x=>x.id!==f.id); save(); renderNav(); renderIVFs(app); } };
    app.querySelector("#prn").onclick=()=>printIVF(f);
  };
  draw();
}

const OT_RATES   = ['@1.33','@1.5','@2','@2.33','Normal rate'];
const OT_SHIFTS  = ['A - Day','A - Night','B - Day','B - Night','C - Day','C - Night','D - Day','D - Night','Day','Night'];
const OT_REASONS = ['Leave','Vacant','Stock count','Induction','Public holiday','Sick','Operational requirement'];
const OT_REMARKS = ['Cover shift A','Cover shift B','Cover shift C','Cover shift D','Stock count','HSE Induction Training'];
const OT_STATUS_LABEL = { pending:'Pending approval', approved:'Approved', rejected:'Rejected' };
const OT_STATUS_PILL  = { pending:'warn', approved:'ok', rejected:'bad' };

function otBuildPayPeriods(){
  const out=[]; let m=11,y=2025;                 // start 16Dec 2025 - 15Jan 2026
  for(let i=0;i<13;i++){
    const nm=(m+1)%12, ny=m===11?y+1:y;
    out.push(`16${OT_MONTHS3[m]} ${y} - 15${OT_MONTHS3[nm]} ${ny}`);
    m=nm; y=ny;
  }
  out.push('Final Pay Period');
  return out;
}
const OT_PAY_PERIODS = otBuildPayPeriods();
const OT_PAY_MONTHS  = ['Dec 2025', ...OT_MONTHS3.map(m=>`${m} 2026`), 'Jan 2027'];

function otMonth3(iso){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); return isNaN(d)?"":OT_MONTHS3[d.getMonth()]; }
function otPeriodForDate(iso){
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return "";
  let sm=d.getMonth(), sy=d.getFullYear();
  if(d.getDate()<16){ sm-=1; if(sm<0){ sm=11; sy-=1; } }
  const em=(sm+1)%12, ey=sm===11?sy+1:sy;
  const label=`16${OT_MONTHS3[sm]} ${sy} - 15${OT_MONTHS3[em]} ${ey}`;
  return OT_PAY_PERIODS.includes(label)?label:"";
}
function otPayMonthForPeriod(period){
  if(!period || period==="Final Pay Period") return "";
  const m=period.match(/- 15([A-Za-z]+) (\d{4})$/); if(!m) return "";
  const label=`${m[1]} ${m[2]}`;
  return OT_PAY_MONTHS.includes(label)?label:"";
}
function otCurrentPayMonth(){ return otPayMonthForPeriod(otPeriodForDate(TODAY())) || OT_PAY_MONTHS[OT_PAY_MONTHS.length-2]; }

function otFmtDateShort(d){ if(!d) return ""; const dt=new Date(d+"T00:00:00"); return isNaN(dt)?d:dt.toLocaleDateString("en-ZA",{weekday:"short",day:"2-digit",month:"short"}); }
function otFmtDateTime(d){ if(!d) return ""; const dt=new Date(d); return isNaN(dt)?d:dt.toLocaleString("en-ZA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function otHours(v){ const n=Number(v); return isNaN(n)?0:n; }
function otFmtH(v){ return (Math.round(otHours(v)*100)/100).toString(); }
function otStaffName(rec){ return (rec.overtime_staff&&rec.overtime_staff.name) || rec.cover_by || "—"; }
function otIsManager(){ return /^manager$/i.test(currentRole()); }
function otReload(){ renderRoute(); }
function otErr(app,e){
  console.error(e);
  app.innerHTML = `<div class="empty">Could not load the overtime data.<br><br>${esc(e.message||e)}<br><br>
    <span class="mini">The overtime_staff / overtime_entries tables live in the shared GZI Supabase project.</span><br><br>
    <button class="btn" onclick="renderRoute()">Retry</button></div>`;
}

/* ---------- data layer (PostgREST over the shared project) ---------- */
const OT_ENT_SEL = encodeURIComponent("*,overtime_staff(name,employee_no,shift)");
const OT = {
  getStaff: () => sb("overtime_staff?select=*&order=sort_order.asc,name.asc"),
  createStaff: p => sb("overtime_staff", {method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify(p)}),
  updateStaff: (id,p) => sb("overtime_staff?id=eq."+encodeURIComponent(id), {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify(p)}),
  deleteStaff: id => sb("overtime_staff?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:{Prefer:"return=minimal"}}),
  getEntries: ({status,payMonth,staffId}={}) => {
    let q = "overtime_entries?select="+OT_ENT_SEL+"&order=work_date.desc,created_at.desc";
    if(status)  q += "&status=eq."+encodeURIComponent(status);
    if(payMonth) q += "&pay_month=eq."+encodeURIComponent(payMonth);
    if(staffId) q += "&staff_id=eq."+encodeURIComponent(staffId);
    return sb(q);
  },
  recentDecided: () => sb("overtime_entries?select="+encodeURIComponent("*,overtime_staff(name,employee_no)")+"&status=in.(approved,rejected)&order=decided_at.desc&limit=25"),
  createEntry: p => sb("overtime_entries", {method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify(p)}),
  updateEntry: (id,p) => sb("overtime_entries?id=eq."+encodeURIComponent(id), {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify(p)}),
  deleteEntry: id => sb("overtime_entries?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:{Prefer:"return=minimal"}}),
  decideEntry: (id,{status,note}) => sb("overtime_entries?id=eq."+encodeURIComponent(id), {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify({
    status, decision_note: note||null, decided_by: null, decided_by_email: currentRole(), decided_at: new Date().toISOString(), updated_at: new Date().toISOString()
  })}),
};

/* ================= OVERTIME SHEET ================= */
let otSheetState = { payMonth:"", status:"all", staffId:"" };

async function renderOvertimeSheet(app){
  let staff, entries;
  try{
    [staff, entries] = await Promise.all([
      OT.getStaff(),
      OT.getEntries({
        payMonth: otSheetState.payMonth || undefined,
        status: otSheetState.status==="all" ? undefined : otSheetState.status,
        staffId: otSheetState.staffId || undefined
      })
    ]);
  }catch(e){ return otErr(app,e); }

  const totalHours = entries.reduce((s,e)=>s+otHours(e.hours),0);
  const pendingCount = entries.filter(e=>e.status==="pending").length;

  app.innerHTML = `
    <div class="page-h"><h2>🕒 Overtime Sheet</h2>
      <p>Technical Stores / Warehouse overtime — capture hours, then submit for manager approval. Shares the same records as the GZI Loading Schedule.</p></div>

    <div class="cards" id="ot_kpis">
      ${kpi("Entries shown", entries.length, "")}
      ${kpi("Total hours", otFmtH(totalHours), "")}
      ${kpi("Pending approval", pendingCount, "awaiting a manager", pendingCount?"warn":"ok","overtime_approvals")}
      ${kpi("Employees", staff.length, "Manage warehouse team", "mut","overtime_staff")}
    </div>

    <div class="toolbar no-print">
      <select id="ot_f_pm"><option value="">All pay months</option>${OT_PAY_MONTHS.map(m=>`<option ${otSheetState.payMonth===m?"selected":""}>${esc(m)}</option>`).join("")}</select>
      <select id="ot_f_staff"><option value="">All employees</option>${staff.map(s=>`<option value="${esc(s.id)}" ${otSheetState.staffId===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
      <span id="ot_f_status">
        <button class="btn ghost sm" data-s="all">All</button>
        <button class="btn ghost sm" data-s="pending">Pending</button>
        <button class="btn ghost sm" data-s="approved">Approved</button>
        <button class="btn ghost sm" data-s="rejected">Rejected</button>
      </span>
      <span class="right"></span>
      <button class="btn ghost sm" id="ot_print">Print</button>
      <button class="btn" id="ot_add">＋ New overtime</button>
    </div>

    <div class="panel"><div class="tablewrap">
      <table class="grid">
        <thead><tr>
          <th>Date</th><th>Month</th><th>Overtime period</th><th>Pay month</th>
          <th>Cover for</th><th>Cover by</th><th>Shift</th><th class="num">Hours</th><th>Rate</th>
          <th>Remarks</th><th>Reason</th><th>Status</th><th class="no-print"></th>
        </tr></thead>
        <tbody>
          ${entries.length ? entries.map(e=>{
            const locked = e.status==="approved" && !otIsManager();
            return `<tr>
              <td>${esc(otFmtDateShort(e.work_date))}</td>
              <td class="mini">${esc(e.month || otMonth3(e.work_date))}</td>
              <td class="mini">${esc(e.overtime_period||"")}</td>
              <td class="mini">${esc(e.pay_month||"")}</td>
              <td>${esc(e.cover_for||"")}</td>
              <td>${esc(otStaffName(e))}${e.overtime_staff&&e.overtime_staff.employee_no?` <span class="mini">${esc(e.overtime_staff.employee_no)}</span>`:""}</td>
              <td class="mini">${esc(e.shift||"")}</td>
              <td class="num">${otFmtH(e.hours)}</td>
              <td class="mini">${esc(e.overtime_rate||"")}</td>
              <td class="mini">${esc(e.remarks||"")}</td>
              <td class="mini">${esc(e.reason||"")}</td>
              <td><span class="pill ${OT_STATUS_PILL[e.status]||"mut"}">${esc(OT_STATUS_LABEL[e.status]||e.status)}</span>${e.status==="rejected"&&e.decision_note?`<div class="mini" title="${esc(e.decision_note)}">${esc(e.decision_note)}</div>`:""}</td>
              <td class="no-print" style="white-space:nowrap">
                <button class="btn ghost sm" data-edit="${esc(e.id)}" ${locked?"disabled":""}>${locked?"Locked":"Edit"}</button>
                <button class="btn danger sm" data-del="${esc(e.id)}" ${locked?"disabled":""}>✕</button>
              </td>
            </tr>`;
          }).join("") : `<tr><td colspan="13" class="empty">No overtime captured yet. Click “＋ New overtime”.</td></tr>`}
        </tbody>
        ${entries.length?`<tfoot><tr><td colspan="7"><b>Total</b></td><td class="num"><b>${otFmtH(totalHours)}</b></td><td colspan="5"></td></tr></tfoot>`:""}
      </table>
    </div></div>
  `;

  app.querySelectorAll("#ot_f_status [data-s]").forEach(b=>{
    const on=b.dataset.s===otSheetState.status; b.classList.toggle("sec",on); b.classList.toggle("ghost",!on);
    b.onclick=()=>{ otSheetState.status=b.dataset.s; renderOvertimeSheet(app); };
  });
  app.querySelector("#ot_f_pm").onchange = e=>{ otSheetState.payMonth=e.target.value; renderOvertimeSheet(app); };
  app.querySelector("#ot_f_staff").onchange = e=>{ otSheetState.staffId=e.target.value; renderOvertimeSheet(app); };

    const e = entries.find(x=>x.id===el.dataset.del);
    if(!confirm(`Delete this overtime entry (${otStaffName(e)}, ${otFmtDateShort(e.work_date)}, ${otFmtH(e.hours)}h)?`)) return;
    try{ await OT.deleteEntry(e.id); toast("Overtime entry deleted."); renderOvertimeSheet(app); }
    catch(err){ toast(err.message); }
  });
}

function openOvertimeModal(staff, entry){
  const isEdit = !!entry;
  const v = (f,d="") => esc(entry && entry[f]!=null ? entry[f] : d);
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-back"><div class="modal">
      <h3>${isEdit?"Edit overtime entry":"New overtime entry"}</h3>
      <div class="body"><div class="formgrid">
        <div class="fld wide"><label>Employee (who worked the overtime) *</label>
          <select id="ot_staff"><option value="">— Select employee —</option>
            ${staff.map(s=>`<option value="${esc(s.id)}" data-name="${esc(s.name)}" data-shift="${esc(s.shift||"")}" ${entry&&entry.staff_id===s.id?"selected":""}>${esc(s.name)}${s.employee_no?" · "+esc(s.employee_no):""}</option>`).join("")}
          </select>
        </div>
        <div class="fld"><label>Date *</label><input type="date" id="ot_date" value="${v("work_date")}"></div>
        <div class="fld"><label>Month</label><input id="ot_month" class="ro" disabled value="${v("month")}" placeholder="auto from date"></div>
        <div class="fld"><label>Overtime period *</label>
          <select id="ot_period"><option value="">— Select period —</option>
            ${OT_PAY_PERIODS.map(p=>`<option ${entry&&entry.overtime_period===p?"selected":""}>${esc(p)}</option>`).join("")}
          </select>
        </div>
        <div class="fld"><label>Pay month *</label>
          <select id="ot_pm"><option value="">— Select pay month —</option>
            ${OT_PAY_MONTHS.map(m=>`<option ${entry&&entry.pay_month===m?"selected":""}>${esc(m)}</option>`).join("")}
          </select>
        </div>
        <div class="fld"><label>Cover for (who / which shift)</label>
          <input id="ot_coverfor" list="ot_cf_list" value="${v("cover_for")}" placeholder="e.g. Shift A or a name">
          <datalist id="ot_cf_list">${["Shift A","Shift B","Shift C","Shift D",...staff.map(s=>s.name)].map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
        </div>
        <div class="fld"><label>Cover by (person covering)</label><input id="ot_coverby" value="${v("cover_by")}" placeholder="defaults to the employee"></div>
        <div class="fld"><label>Shift</label>
          <select id="ot_shift"><option value=""></option>${OT_SHIFTS.map(s=>`<option ${entry&&entry.shift===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
        </div>
        <div class="fld"><label>Hours *</label><input type="number" step="0.01" min="0" id="ot_hours" value="${v("hours")}"></div>
        <div class="fld"><label>Overtime rate</label>
          <select id="ot_rate"><option value=""></option>${OT_RATES.map(r=>`<option ${entry&&entry.overtime_rate===r?"selected":""}>${esc(r)}</option>`).join("")}</select>
        </div>
        <div class="fld"><label>Remarks</label><input id="ot_remarks" list="ot_rm_list" value="${v("remarks")}">
          <datalist id="ot_rm_list">${OT_REMARKS.map(r=>`<option value="${esc(r)}"></option>`).join("")}</datalist>
        </div>
        <div class="fld"><label>Reason</label><input id="ot_reason" list="ot_rs_list" value="${v("reason")}">
          <datalist id="ot_rs_list">${OT_REASONS.map(r=>`<option value="${esc(r)}"></option>`).join("")}</datalist>
        </div>
      </div>
      <p class="hintline">On save this entry is submitted with status <b>Pending approval</b>. A Manager signs it off on the Overtime Approvals page.</p>
      </div>
      <div class="foot">
        <button class="btn" id="ot_save">${isEdit?"Save & resubmit":"Submit for approval"}</button>
        <button class="btn ghost" id="ot_cancel">Cancel</button>
      </div>
    </div></div>`;

  const dateEl=root.querySelector("#ot_date"), monthEl=root.querySelector("#ot_month"),
        periodEl=root.querySelector("#ot_period"), payEl=root.querySelector("#ot_pm"),
        staffEl=root.querySelector("#ot_staff"), coverByEl=root.querySelector("#ot_coverby"), shiftEl=root.querySelector("#ot_shift");

  function syncFromDate(){
    monthEl.value = otMonth3(dateEl.value);
    if(!periodEl.value){ const p=otPeriodForDate(dateEl.value); if(p) periodEl.value=p; }
    if(!payEl.value){ const pm=otPayMonthForPeriod(periodEl.value); if(pm) payEl.value=pm; }
  }
  dateEl.addEventListener("change", syncFromDate);
  periodEl.addEventListener("change", ()=>{ if(!payEl.value){ const pm=otPayMonthForPeriod(periodEl.value); if(pm) payEl.value=pm; } });
  staffEl.addEventListener("change", ()=>{
    const opt=staffEl.selectedOptions[0]; if(!opt) return;
    if(!coverByEl.value) coverByEl.value = opt.dataset.name||"";
    if(!shiftEl.value && opt.dataset.shift){ const m=OT_SHIFTS.find(s=>s.startsWith(opt.dataset.shift+" ")); if(m) shiftEl.value=m; }
  });
  if(!isEdit && !dateEl.value){ dateEl.value=TODAY(); }
  if(!isEdit) syncFromDate();

  root.querySelector("#ot_cancel").onclick = closeModal;
  root.querySelector(".modal-back").onclick = e=>{ if(e.target.classList.contains("modal-back")) closeModal(); };
  root.querySelector("#ot_save").onclick = async ()=>{
    const staffId=staffEl.value, workDate=dateEl.value, hours=root.querySelector("#ot_hours").value;
    if(!staffId){ toast("Select the employee."); return; }
    if(!workDate){ toast("Pick the work date."); return; }
    if(hours==="" || isNaN(Number(hours)) || Number(hours)<=0){ toast("Enter the hours worked."); return; }
    if(!periodEl.value){ toast("Select the overtime period."); return; }
    if(!payEl.value){ toast("Select the pay month."); return; }
    const chosen = staffEl.selectedOptions[0];
    const payload = {
      staff_id: staffId, work_date: workDate, month: otMonth3(workDate),
      overtime_period: periodEl.value, pay_month: payEl.value,
      cover_for: root.querySelector("#ot_coverfor").value.trim() || null,
      cover_by: coverByEl.value.trim() || (chosen && chosen.dataset.name) || null,
      shift: shiftEl.value || null, hours: Number(hours),
      overtime_rate: root.querySelector("#ot_rate").value || null,
      remarks: root.querySelector("#ot_remarks").value.trim() || null,
      reason: root.querySelector("#ot_reason").value.trim() || null,
      status: "pending",
      decided_by: null, decided_by_email: null, decision_note: null, decided_at: null,
      updated_at: new Date().toISOString()
    };
    if(!isEdit) payload.submitted_by_email = currentRole();
    const btn = root.querySelector("#ot_save"); btn.disabled=true; btn.textContent="Saving…";
    try{
      if(isEdit) await OT.updateEntry(entry.id, payload); else await OT.createEntry(payload);
      closeModal(); toast("Overtime submitted for manager approval."); renderRoute();
    }catch(err){ toast(err.message); btn.disabled=false; btn.textContent=isEdit?"Save & resubmit":"Submit for approval"; }
  };
}

/* ================= OVERTIME SUMMARY (per employee) ================= */
let otSummaryState = { payMonth:"", basis:"approved" };   // basis: approved | all

async function renderOvertimeSummary(app){
  if(!otSummaryState.payMonth) otSummaryState.payMonth = otCurrentPayMonth();
  let staff, entries;
  try{
    [staff, entries] = await Promise.all([ OT.getStaff(), OT.getEntries({ payMonth: otSummaryState.payMonth }) ]);
  }catch(e){ return otErr(app,e); }

  const counted = entries.filter(e => otSummaryState.basis==="all" ? e.status!=="rejected" : e.status==="approved");
  const rows = staff.map(s=>{
    const mine = counted.filter(e=>e.staff_id===s.id);
    const bucket = { '@2':0,'@2.33':0,'@1.5':0,'@1.33':0, night:0, other:0 };
    let total=0, pendingH=0;
    entries.filter(e=>e.staff_id===s.id).forEach(e=>{ if(e.status==="pending") pendingH+=otHours(e.hours); });
    mine.forEach(e=>{
      const h=otHours(e.hours); total+=h;
      if(bucket[e.overtime_rate]!==undefined) bucket[e.overtime_rate]+=h; else bucket.other+=h;
      if((e.shift||"").toLowerCase().includes("night")) bucket.night+=h;
    });
    return { staff:s, bucket, total, pendingH, left:OT_MAX_HOURS-total, over:total>OT_MAX_HOURS, entryCount:mine.length };
  }).filter(r=>r.total>0 || r.pendingH>0);

  const grand = rows.reduce((a,r)=>{ a.total+=r.total; a.night+=r.bucket.night; ['@2','@2.33','@1.5','@1.33'].forEach(k=>a[k]+=r.bucket[k]); return a; },
    { total:0, night:0, '@2':0, '@2.33':0, '@1.5':0, '@1.33':0 });
  const overCount = rows.filter(r=>r.over).length;

  app.innerHTML = `
    <div class="page-h"><h2>📅 Overtime Summary</h2>
      <p>Overtime hours per employee, per pay month — flags anyone over the ${OT_MAX_HOURS}-hour limit.</p></div>

    <div class="cards">
      ${kpi("Employees with overtime", rows.length, "")}
      ${kpi("Total overtime hours", otFmtH(grand.total), esc(otSummaryState.payMonth))}
      ${kpi("Over the "+OT_MAX_HOURS+"h limit", overCount, "", overCount?"bad":"ok")}
      ${kpi("Limit per employee", OT_MAX_HOURS+"h", "per pay month","mut")}
    </div>

    <div class="toolbar no-print">
      <select id="ots_pm">${OT_PAY_MONTHS.map(m=>`<option ${otSummaryState.payMonth===m?"selected":""}>${esc(m)}</option>`).join("")}</select>
      <span id="ots_basis">
        <button class="btn ghost sm" data-b="approved">Approved only</button>
        <button class="btn ghost sm" data-b="all">Approved + pending</button>
      </span>
      <span class="right"></span>
      <button class="btn ghost sm" id="ots_print">Print</button>
    </div>

    <div class="panel"><div class="tablewrap">
      <table class="grid">
        <thead><tr>
          <th>Name</th><th>No</th><th>Pay month</th>
          <th class="num">Night shift</th><th class="num">Hrs @2</th><th class="num">Hrs @2.33</th><th class="num">Hrs @1.5</th><th class="num">Hrs @1.33</th>
          <th class="num">Total hrs</th><th>Hours left to ${OT_MAX_HOURS}</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>`<tr>
            <td>${esc(r.staff.name)}</td>
            <td class="mini">${esc(r.staff.employee_no||"")}</td>
            <td class="mini">${esc(otSummaryState.payMonth)}</td>
            <td class="num">${r.bucket.night?otFmtH(r.bucket.night):"—"}</td>
            <td class="num">${r.bucket['@2']?otFmtH(r.bucket['@2']):"—"}</td>
            <td class="num">${r.bucket['@2.33']?otFmtH(r.bucket['@2.33']):"—"}</td>
            <td class="num">${r.bucket['@1.5']?otFmtH(r.bucket['@1.5']):"—"}</td>
            <td class="num">${r.bucket['@1.33']?otFmtH(r.bucket['@1.33']):"—"}</td>
            <td class="num"><b>${otFmtH(r.total)}</b>${r.pendingH?`<div class="mini">+${otFmtH(r.pendingH)} pending</div>`:""}</td>
            <td>${r.over
              ? `<span class="pill bad">Over by ${otFmtH(r.total-OT_MAX_HOURS)} h</span>`
              : `<span class="pill ${r.left<=OT_LOW_LEFT?"warn":"ok"}">${otFmtH(r.left)} h left before max</span>`}</td>
          </tr>`).join("") : `<tr><td colspan="10" class="empty">No ${otSummaryState.basis==="approved"?"approved ":""}overtime for ${esc(otSummaryState.payMonth)}.</td></tr>`}
        </tbody>
        ${rows.length?`<tfoot><tr>
          <td colspan="3"><b>Totals</b></td>
          <td class="num"><b>${otFmtH(grand.night)}</b></td><td class="num"><b>${otFmtH(grand['@2'])}</b></td><td class="num"><b>${otFmtH(grand['@2.33'])}</b></td>
          <td class="num"><b>${otFmtH(grand['@1.5'])}</b></td><td class="num"><b>${otFmtH(grand['@1.33'])}</b></td>
          <td class="num"><b>${otFmtH(grand.total)}</b></td><td></td>
        </tr></tfoot>`:""}
      </table>
    </div></div>
    <p class="mini">“Total hrs” is every ${otSummaryState.basis==="approved"?"approved":"approved/pending"} overtime hour for the employee in the pay month. Anyone above ${OT_MAX_HOURS} h is flagged red; otherwise the badge shows hours remaining before the limit.</p>
  `;

  app.querySelector("#ots_pm").onchange = e=>{ otSummaryState.payMonth=e.target.value; renderOvertimeSummary(app); };

  }
}

 *  LEAVE SCHEDULE  (shared with GZI Loading Schedule)
 *  Same Supabase project + leave_types / leave_requests tables,
 *  and reuses the Overtime module's overtime_staff table + shift
 *  list. Approving a leave request creates pending cover overtime

const LEAVE_STATUS_LABEL = { pending:"Pending approval", approved:"Approved", rejected:"Declined" };
const LEAVE_STATUS_PILL  = { pending:"warn", approved:"ok", rejected:"bad" };

function lvISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function lvAddDaysISO(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return lvISO(d); }
function lvWorkingDays(startISO,endISO){
  const out=[];
  if(!startISO||!endISO) return out;
  const d=new Date(startISO+"T00:00:00"), end=new Date(endISO+"T00:00:00");
  if(isNaN(d)||isNaN(end)||d>end) return out;
  let guard=0;
  while(d<=end && guard++<400){ const dow=d.getDay(); if(dow>=1&&dow<=5) out.push(lvISO(d)); d.setDate(d.getDate()+1); }
  return out;
}
function lvSastSendAfterISO(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,6,0,0)).toISOString(); }
function lvCoverShiftFor(letter){ if(!letter) return ""; return OT_SHIFTS.find(s=>s.startsWith(letter+" "))||""; }
function lvIsManager(){ return otIsManager(); }
function lvErr(app,e){
  console.error(e);
  app.innerHTML = `<div class="empty">Could not load the leave data.<br><br>${esc(e.message||e)}<br><br>
    <span class="mini">The leave_types / leave_requests tables live in the shared GZI Supabase project.</span><br><br>
    <button class="btn" onclick="renderRoute()">Retry</button></div>`;
}

      </div>
      <div class="foot">
        <button class="btn" id="lv_save">${isEdit?"Save & resubmit":"Submit for approval"}</button>
        <button class="btn ghost" id="lv_cancel">Cancel</button>
      </div>
    </div></div>`;

  root.querySelector("#lv_cancel").onclick = closeModal;
  root.querySelector(".modal-back").onclick = e=>{ if(e.target.classList.contains("modal-back")) closeModal(); };

  const startEl=root.querySelector("#lv_start"), endEl=root.querySelector("#lv_end"), daysEl=root.querySelector("#lv_days");
  const coverEl=root.querySelector("#lv_cover"), coverShiftEl=root.querySelector("#lv_covershift");
  function recalcDays(){
    if(startEl.value && !endEl.value) endEl.value=startEl.value;
    if(startEl.value && endEl.value && endEl.value<startEl.value) endEl.value=startEl.value;
    daysEl.value = (startEl.value&&endEl.value) ? lvWorkingDays(startEl.value,endEl.value).length : "";
  }
  startEl.addEventListener("change",recalcDays);
  endEl.addEventListener("change",recalcDays);
  coverEl.addEventListener("change", ()=>{

    if(opt && opt.dataset.shift && !coverShiftEl.value){ const m=lvCoverShiftFor(opt.dataset.shift); if(m) coverShiftEl.value=m; }
  });

      if(isEdit) await LV.updateRequest(req.id, payload); else await LV.createRequest(payload);
      closeModal(); toast("Leave request submitted for approval."); renderRoute();
    }catch(err){ toast(err.message); btn.disabled=false; btn.textContent=isEdit?"Save & resubmit":"Submit for approval"; }
  };
}
